# =========================================================
# CAMPUSFIX APPLICATION
# =========================================================

spring.application.name=campusfix-server

# Render provides PORT at runtime; keep 4040 for local development.
server.port=${PORT:4040}

# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campusfix?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =========================================================
# JWT CONFIGURATION
# =========================================================

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Render's local filesystem is ephemeral. Set UPLOAD_DIR to a mounted disk
# when persistent uploads are required.
app.upload.dir=${UPLOAD_DIR:/tmp/uploads/complaints}

# =========================================================
# EMAIL NOTIFICATIONS
# =========================================================

app.email.enabled=${APP_EMAIL_ENABLED:false}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false

# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.security=INFO
logging.level.app=INFO
